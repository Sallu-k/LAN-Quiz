<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN Quiz — Projector</title>
<link rel="stylesheet" href="themes.css">
<script src="theme-picker.js"></script>
<script src="event-name.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  [hidden] { display: none !important; }

  .corner { position: fixed; top: 18px; right: 20px; z-index: 30; }
  .stage { position: fixed; inset: 0; overflow: hidden; }
  /* Each "screen" fills the stage and establishes its own positioning context, so its
     (position:absolute) contents give it a real box — not just a zero-size wrapper. */
  #idle, #locked, #roundView, #specialView { position: absolute; inset: 0; }
  /* The header sits in normal flow (its own reserved strip) so the scaled grid below it
     can never grow over it and cover it — the two used to share the same absolute layer. */
  #roundView, #specialView { display: flex; flex-direction: column; align-items: center; }

  /* ---- idle / locked messages ---- */
  .msgScreen { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 90vw; }
  .msgScreen .brand { font-size: 1.6vw; letter-spacing: 6px; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: 1.2vw; }
  .msgScreen h1 { font-size: 3.6vw; margin: 0; font-weight: 800; }
  .msgScreen p { font-size: 1.6vw; color: var(--muted); margin-top: 1vw; }

  /* ---- round header (name + countdown), shown above the question grid ---- */
  .hdr { flex: none; text-align: center; padding: 3vh 0 1vh; }
  .hdr .rname { font-size: 2.2vw; font-weight: 700; color: var(--muted); letter-spacing: 1px; }
  .hdr .timer { font-variant-numeric: tabular-nums; font-size: 9vw; font-weight: 800; line-height: 1; }
  .hdr .timer.low { color: var(--bad); animation: pulse 1s ease-in-out infinite; }
  .hdr .timer.locked { color: var(--good); font-size: 6vw; }
  @keyframes pulse { 50% { opacity: .55; } }

  /* The grid is scaled to fit exactly this area — never the header — so it can grow as
     large as possible without ever overlapping the countdown above it. */
  .gridArea { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; }

  /* ---- the fitted question grid: sized/scaled by JS, laid out at a fixed "design" size ---- */
  .wrap { position: absolute; top: 50%; left: 50%; transform-origin: center; width: max-content; }
  .grid { display: grid; gap: 26px; }
  .card { width: 460px; background: var(--panel); border: 3px solid var(--line); border-radius: 22px; padding: 26px 28px; }
  .card .num { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
    background: var(--panel2); color: var(--muted); font-weight: 800; font-size: 20px; margin-bottom: 14px; }
  .card .text { font-size: 27px; font-weight: 700; line-height: 1.3; margin-bottom: 16px; min-height: 2.6em; }
  .card .opts { display: flex; flex-direction: column; gap: 10px; }
  .card .opt { display: flex; align-items: center; gap: 12px; background: var(--panel2); border-radius: 12px; padding: 10px 14px; font-size: 21px; }
  .card .opt .letter { flex: none; width: 30px; height: 30px; border-radius: 8px; background: var(--bg); color: var(--muted);
    display: grid; place-items: center; font-weight: 800; font-size: 16px; }
  .card .tag { display: inline-block; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }

  /* ---- special-question takeover: one big card ---- */
  .special .tagbar { flex: none; text-align: center; margin-top: 3vh; }
  .special .tagbar span { background: var(--warn); color: #2b1a00; font-weight: 800; letter-spacing: 3px; padding: 10px 22px; border-radius: 10px; font-size: 22px; }
  .special .for { flex: none; text-align: center; font-size: 26px; color: var(--muted); margin-top: 10px; }
  .special .card { width: 900px; border-color: var(--warn); }
  .special .text { font-size: 40px; min-height: 0; margin-bottom: 26px; }
  .special .opt { font-size: 28px; padding: 16px 20px; }
  .special .letter { width: 40px; height: 40px; font-size: 20px; }
</style>
</head>
<body>

<div class="corner" id="themeSlot"></div>

<div class="stage" id="stage">
  <div id="idle" class="msgScreen" hidden>
    <div class="brand">LAN Quiz</div>
    <h1>Waiting for the host to start a round</h1>
    <p>The next round's questions will appear here.</p>
  </div>

  <div id="locked" class="msgScreen" hidden>
    <div class="brand">LAN Quiz</div>
    <h1 id="lockedName">Round complete</h1>
    <p>See the host for scores.</p>
  </div>

  <div id="roundView" hidden>
    <div class="hdr">
      <div class="rname" id="rname"></div>
      <div class="timer" id="timer">0:00</div>
    </div>
    <div class="gridArea" id="gridArea">
      <div class="wrap" id="wrap"><div class="grid" id="grid"></div></div>
    </div>
  </div>

  <div id="specialView" class="special" hidden>
    <div class="tagbar"><span>Special question</span></div>
    <div class="for" id="spFor"></div>
    <div class="hdr"><div class="timer" id="spTimer">0:00</div></div>
    <div class="gridArea" id="spGridArea">
      <div class="wrap" id="spWrap"><div class="grid"><div class="card" id="spCard"></div></div></div>
    </div>
  </div>
</div>

<div id="auth" class="msgScreen" hidden>
  <div class="brand">LAN Quiz</div>
  <h1 style="font-size:2vw;">Host key required</h1>
  <p>Open this page on the laptop running the server, or add ?key=&lt;hostKey&gt; to the address.</p>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  CQTheme.mount($('themeSlot'));

  // A host key can be passed in the URL (?key=...) since this page has no login form of its own.
  var urlKey = new URLSearchParams(location.search).get('key');
  if (urlKey) { try { localStorage.setItem('cq:hostkey', urlKey); } catch (e) {} }
  var hostKey = (function () { try { return localStorage.getItem('cq:hostkey') || ''; } catch (e) { return ''; } })();

  var offset = 0, samples = [];
  var serverNow = function () { return Date.now() + offset; };

  function api(url) {
    return fetch(url, { cache: 'no-store', headers: hostKey ? { 'x-host-key': hostKey } : {} }).then(function (res) {
      return res.json().then(function (json) {
        if (!res.ok) { var e = new Error((json && json.error) || 'error'); e.status = res.status; throw e; }
        if (json.serverNow) {
          samples.push(json.serverNow - Date.now());
          if (samples.length > 5) samples.shift();
          offset = samples.reduce(function (a, b) { return a + b; }, 0) / samples.length;
        }
        return json;
      });
    });
  }

  function show(id) {
    ['idle', 'locked', 'roundView', 'specialView', 'auth'].forEach(function (s) { $(s).hidden = s !== id; });
  }

  function gridCols(n) {
    if (n <= 1) return 1;
    if (n <= 3) return n;
    if (n === 4) return 2;
    if (n <= 6) return 3;
    return 4;
  }

  // Scales `wrap` (already laid out at its natural size) to fill `area` — its own
  // reserved region, not the whole screen — so it can never grow over a header.
  // MARGIN leaves a little breathing room instead of running the cards edge-to-edge
  // (clientWidth/Height is the padding box, so CSS padding on `area` can't do this).
  var MARGIN = 0.94;
  function fitToScreen(area, wrap) {
    wrap.style.transform = 'translate(-50%,-50%) scale(1)';
    var sw = wrap.offsetWidth, sh = wrap.offsetHeight;
    if (!sw || !sh) return;
    var scale = Math.min(area.clientWidth * MARGIN / sw, area.clientHeight * MARGIN / sh);
    scale = Math.max(0.12, Math.min(scale, 3));
    wrap.style.transform = 'translate(-50%,-50%) scale(' + scale + ')';
  }
  function refit() {
    if (!$('roundView').hidden) fitToScreen($('gridArea'), $('wrap'));
    if (!$('specialView').hidden) fitToScreen($('spGridArea'), $('spWrap'));
  }
  window.addEventListener('resize', refit);

  function questionCard(q, i) {
    var card = document.createElement('div');
    card.className = 'card';
    var num = document.createElement('div');
    num.className = 'num';
    num.textContent = String(i + 1);
    card.appendChild(num);
    var text = document.createElement('div');
    text.className = 'text';
    text.textContent = q.text;
    card.appendChild(text);
    if (q.type === 'mcq') {
      var opts = document.createElement('div');
      opts.className = 'opts';
      q.options.forEach(function (label, oi) {
        var row = document.createElement('div');
        row.className = 'opt';
        var l = document.createElement('span');
        l.className = 'letter';
        l.textContent = String.fromCharCode(65 + oi);
        var t = document.createElement('span');
        t.textContent = label;
        row.appendChild(l); row.appendChild(t);
        opts.appendChild(row);
      });
      card.appendChild(opts);
    } else {
      var tag = document.createElement('div');
      tag.className = 'tag';
      tag.textContent = 'One-word answer';
      card.appendChild(tag);
    }
    return card;
  }

  var builtRunId = null;
  function renderRound(r, phase) {
    if (phase === 'locked') {
      $('lockedName').textContent = r.name + ' complete';
      show('locked');
      return;
    }
    if (builtRunId !== r.runId) {
      builtRunId = r.runId;
      var grid = $('grid');
      grid.innerHTML = '';
      grid.style.gridTemplateColumns = 'repeat(' + gridCols(r.questions.length) + ', 1fr)';
      r.questions.forEach(function (q, i) { grid.appendChild(questionCard(q, i)); });
    }
    $('rname').textContent = r.name;
    show('roundView');
    requestAnimationFrame(function () { fitToScreen($('gridArea'), $('wrap')); });
  }

  var builtSpecialId = null;
  function renderSpecial(s) {
    if (builtSpecialId !== s.id) {
      builtSpecialId = s.id;
      var card = $('spCard');
      card.innerHTML = '';
      var built = questionCard(s.question, -1);
      built.querySelector('.num').remove(); // no question number in a single-question takeover
      while (built.firstChild) card.appendChild(built.firstChild);
    }
    $('spFor').textContent = 'Team ' + s.teamId;
    show('specialView');
    requestAnimationFrame(function () { fitToScreen($('spGridArea'), $('spWrap')); });
  }

  var mmss = function (ms) {
    var s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  };
  var current = null; // { kind: 'round'|'special', endsAt, durationMs }
  function tickTimers() {
    if (!current) return;
    var now = serverNow();
    var rem = current.endsAt - now;
    var el = current.kind === 'round' ? $('timer') : $('spTimer');
    var before = el.textContent;
    if (current.locked) { el.textContent = 'LOCKED'; el.className = 'timer locked'; }
    else {
      el.textContent = mmss(rem);
      el.className = 'timer' + (rem <= 10000 ? ' low' : '');
    }
    // The countdown's own size can shift the header's height by a pixel or two (digit
    // metrics, "LOCKED" vs "12:34", the "low"/pulsing state) — re-fit whenever it changes
    // so the grid below it never drifts into an overlap.
    if (el.textContent !== before) refit();
  }
  setInterval(tickTimers, 100);

  function apply(S) {
    var openSpecial = S.specials.filter(function (s) { return s.status === 'open'; })[0];
    if (openSpecial) {
      current = { kind: 'special', endsAt: openSpecial.endsAt, locked: false };
      renderSpecial(openSpecial);
      return;
    }
    if (!S.round) {
      current = null;
      builtRunId = null;
      show('idle');
      return;
    }
    current = { kind: 'round', endsAt: S.round.endsAt, locked: S.round.phase === 'locked' };
    renderRound(S.round, S.round.phase);
  }

  function poll() {
    api('/api/host/state').then(apply).catch(function (e) {
      if (e.status === 401) show('auth');
      // any other error: keep showing the last good frame and just retry
    }).then(function () { setTimeout(poll, 1000); });
  }
  show('idle');
  poll();
})();
</script>
</body>
</html>
